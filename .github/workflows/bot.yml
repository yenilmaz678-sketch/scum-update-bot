- name: Discord tek tek gönder (TR TEMİZ)
  if: env.SEND == 'true'
  run: |
    RESIM="https://cdn.cloudflare.steamstatic.com/steam/apps/513710/header.jpg"
    THUMB="https://cdn.cloudflare.steamstatic.com/steam/apps/513710/capsule_184x69.jpg"

    for i in {1..5}
    do
      RAW_DATE=$(sed -n "${i}p" dates.txt)
      TITLE=$(sed -n "${i}p" titles.txt)
      LINK=$(sed -n "${i}p" links.txt)

      [ -z "$TITLE" ] && continue

      # Türkçe tarih
      GUN=$(date -d "$RAW_DATE" +"%d")
      AY_EN=$(date -d "$RAW_DATE" +"%m")
      YIL=$(date -d "$RAW_DATE" +"%Y")

      case $AY_EN in
        01) AY="Ocak";;
        02) AY="Şubat";;
        03) AY="Mart";;
        04) AY="Nisan";;
        05) AY="Mayıs";;
        06) AY="Haziran";;
        07) AY="Temmuz";;
        08) AY="Ağustos";;
        09) AY="Eylül";;
        10) AY="Ekim";;
        11) AY="Kasım";;
        12) AY="Aralık";;
      esac

      DATE_TR="$GUN $AY $YIL"

      # İngilizce başlığı Türkçeleştir
      TITLE_TR=$(echo "$TITLE" \
        | sed 's/officially live/yayınlandı/i' \
        | sed 's/update/güncelleme/i' \
        | sed 's/patch/yama/i' \
        | sed 's/hotfix/düzeltme/i')

      # Açıklama
      if echo "$TITLE" | grep -iq "hotfix"; then
        ACIKLAMA="Küçük hatalar düzeltildi ve oyun daha stabil hale getirildi."
      elif echo "$TITLE" | grep -iqE "update|patch"; then
        ACIKLAMA="Yeni içerikler ve önemli sistem güncellemeleri eklendi."
      else
        ACIKLAMA="Yeni bir duyuru veya içerik paylaşımı yapıldı."
      fi

      # Renk
      if echo "$TITLE" | grep -iqE "update|patch"; then
        RENK=16711680
        DURUM="🔥 BÜYÜK GÜNCELLEME"
      else
        RENK=65280
        DURUM="🟢 Güncelleme"
      fi

      echo "{
        \"embeds\": [{
          \"title\": \"$DURUM\",
          \"description\": \"📅 $DATE_TR\n\n🆕 $TITLE_TR\n\n🧠 $ACIKLAMA\",
          \"url\": \"$LINK\",
          \"color\": $RENK,
          \"thumbnail\": {\"url\": \"$THUMB\"},
          \"image\": {\"url\": \"$RESIM\"}
        }]
      }" > payload.json

      curl -X POST -H "Content-Type: application/json" \
      --data @payload.json \
     https://discord.com/api/webhooks/1501336581766905967/RuuRcbC0UaP72dD2qzfgftno3Y-Jw3ksc2TmIYF5sztqkNszGh8V-wEhImjDwR0z6Evl

      sleep 2
    done
