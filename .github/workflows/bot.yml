name: SCUM SMART BOT

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Haberleri çek
        run: |
          curl -s https://store.steampowered.com/feeds/news/app/513710/ > feed.xml

          grep -o '<title>.*</title>' feed.xml | sed '1d' | head -n 5 | sed 's/<[^>]*>//g' > titles.txt
          grep -o '<link>.*</link>' feed.xml | sed '1d' | head -n 5 | sed 's/<[^>]*>//g' > links.txt
          grep -o '<pubDate>.*</pubDate>' feed.xml | head -n 5 | sed 's/<[^>]*>//g' > dates.txt

          touch sent.txt

      - name: Yeni olanları gönder
        run: |
          RESIM="https://cdn.cloudflare.steamstatic.com/steam/apps/513710/header.jpg"
          THUMB="https://cdn.cloudflare.steamstatic.com/steam/apps/513710/capsule_184x69.jpg"

          for i in 5 4 3 2 1
          do
            TITLE=$(sed -n "${i}p" titles.txt)
            LINK=$(sed -n "${i}p" links.txt)
            RAW_DATE=$(sed -n "${i}p" dates.txt)

            [ -z "$TITLE" ] && continue

            # Daha önce atılmış mı?
            if grep -Fxq "$TITLE" sent.txt; then
              continue
            fi

            # Türkçe tarih
            GUN=$(date -d "$RAW_DATE" +"%d")
            AY_EN=$(date -d "$RAW_DATE" +"%m")
            YIL=$(date -d "$RAW_DATE" +"%Y")

            case $AY_EN in
              01) AY="Ocak";;
              02) AY="Şubat";;
              03) AY="Mart";;
              04) AY="Nisan";;
              05) AY="Mayıs";;
              06) AY="Haziran";;
              07) AY="Temmuz";;
              08) AY="Ağustos";;
              09) AY="Eylül";;
              10) AY="Ekim";;
              11) AY="Kasım";;
              12) AY="Aralık";;
            esac

            DATE_TR="$GUN $AY $YIL"

            # Türkçeleştirme
            TITLE_TR=$(echo "$TITLE" \
              | sed 's/officially live/yayınlandı/i' \
              | sed 's/update/güncelleme/i' \
              | sed 's/patch/yama/i' \
              | sed 's/hotfix/düzeltme/i')

            # Açıklama
            if echo "$TITLE" | grep -iq "hotfix"; then
              ACIKLAMA="Küçük hatalar düzeltildi ve oyun daha stabil hale getirildi."
            elif echo "$TITLE" | grep -iqE "update|patch"; then
              ACIKLAMA="Yeni içerikler ve önemli sistem güncellemeleri eklendi."
            else
              ACIKLAMA="Yeni bir duyuru veya içerik paylaşımı yapıldı."
            fi

            # Renk
            if echo "$TITLE" | grep -iqE "update|patch"; then
              RENK=16711680
              DURUM="🔥 BÜYÜK GÜNCELLEME"
            else
              RENK=65280
              DURUM="🟢 Güncelleme"
            fi

            echo "{
              \"embeds\": [{
                \"title\": \"$DURUM\",
                \"description\": \"📅 $DATE_TR\n\n🆕 $TITLE_TR\n\n🧠 $ACIKLAMA\",
                \"url\": \"$LINK\",
                \"color\": $RENK,
                \"thumbnail\": {\"url\": \"$THUMB\"},
                \"image\": {\"url\": \"$RESIM\"}
              }]
            }" > payload.json

            curl -X POST -H "Content-Type: application/json" \
            --data @payload.json \
            https://discord.com/api/webhooks/1501336581766905967/RuuRcbC0UaP72dD2qzfgftno3Y-Jw3ksc2TmIYF5sztqkNszGh8V-wEhImjDwR0z6Evl

            echo "$TITLE" >> sent.txt

            sleep 2
          done

      - name: Kaydet
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add sent.txt
          git commit -m "update history" || true
          git push || true
