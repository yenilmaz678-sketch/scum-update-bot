name: SCUM PRO UPDATE BOT

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Haberleri çek
        run: |
          curl -s https://store.steampowered.com/feeds/news/app/513710/ > feed.xml || true

          grep -oP '<title>.*?</title>' feed.xml | sed '1d' | head -n 5 | sed 's/<[^>]*>//g' > titles.txt
          grep -oP '<link>.*?</link>' feed.xml | sed '1d' | head -n 5 | sed 's/<[^>]*>//g' > links.txt

          head -n 1 titles.txt > baslik.txt
          head -n 1 links.txt > link.txt

      - name: Spam kontrol
        run: |
          YENI=$(cat baslik.txt)
          ESKI=$(cat last.txt 2>/dev/null || echo "")

          if [ "$YENI" = "$ESKI" ]; then
            echo "SEND=false" >> $GITHUB_ENV
          else
            echo "SEND=true" >> $GITHUB_ENV
          fi

      - name: Liste hazırla
        if: env.SEND == 'true'
        run: |
          paste titles.txt links.txt | awk '{print "• **" $1 "**\n" $2 "\n"}' > liste.txt

      - name: Büyük update kontrol
        if: env.SEND == 'true'
        run: |
          BASLIK=$(cat baslik.txt)

          if echo "$BASLIK" | grep -iqE "patch|update|hotfix|major"; then
            echo "BUYUK=true" >> $GITHUB_ENV
          else
            echo "BUYUK=false" >> $GITHUB_ENV
          fi

      - name: Discord gönder
        if: env.SEND == 'true'
        run: |
          BASLIK=$(cat baslik.txt)
          LINK=$(cat link.txt)
          LISTE=$(cat liste.txt)

          if [ "$BUYUK" = "true" ]; then
            RENK=16711680
            BASLIK2="🔥 BÜYÜK UPDATE!"
          else
            RENK=65280
            BASLIK2="🟢 Küçük Güncelleme"
          fi

          RESIM="https://cdn.cloudflare.steamstatic.com/steam/apps/513710/header.jpg"

          curl -X POST -H "Content-Type: application/json" \
          -d "{
            \"embeds\":[{
              \"title\":\"$BASLIK2\",
              \"description\":\"📢 **$BASLIK**\n\n📜 Son Güncellemeler:\n\n$LISTE\n🔗 Detay: $LINK\",
              \"url\":\"$LINK\",
              \"color\":$RENK,
              \"image\":{\"url\":\"$RESIM\"}
            }]
          }" \
          $DISCORD_WEBHOOK

      - name: Kaydet
        if: env.SEND == 'true'
        run: |
          cp baslik.txt last.txt

      - name: Push
        if: env.SEND == 'true'
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add last.txt
          git commit -m "update" || true
          git push || true
